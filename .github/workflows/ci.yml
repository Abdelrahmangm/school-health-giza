name: Verify review branch
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-postgres-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Verify isolated PostgreSQL database
        run: npm run test:db
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: disposable-ci-postgres-only
          PGDATABASE: postgres
      - run: npm run build
      - name: Verify no server secret reaches the browser bundle
        run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Download pinned Supabase Auth and PostgREST release binaries
        run: |
          mkdir -p "$RUNNER_TEMP/stack/auth"
          curl -fsSL -o "$RUNNER_TEMP/stack/pgrst.tar.xz" https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz
          tar -xJf "$RUNNER_TEMP/stack/pgrst.tar.xz" -C "$RUNNER_TEMP/stack"
          curl -fsSL -o "$RUNNER_TEMP/stack/auth.tgz" https://github.com/supabase/auth/releases/download/v2.177.0/auth-v2.177.0-x86.tar.gz
          tar -xzf "$RUNNER_TEMP/stack/auth.tgz" -C "$RUNNER_TEMP/stack/auth"
      - name: Integration (Auth + invitations e-mail + PostgREST + PostgreSQL + browser, DEMO only)
        run: bash scripts/test-integration-local.sh
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
          GOTRUE_DIR: ${{ runner.temp }}/stack/auth
          POSTGREST_BIN: ${{ runner.temp }}/stack/postgrest
      - run: npm audit --omit=dev
